<section class="page-header">
  <h1>Detalhes do Cliente</h1>
</section>

<div *ngIf="loading" class="info-box">
  Carregando cliente...
</div>

<div *ngIf="error" class="info-box error">
  {{ error }}
</div>

<form *ngIf="!loading && cliente" class="form-card">
  <div class="form-row">
    <div class="form-group">
      <label for="nome">Nome</label>
      <input id="nome" type="text" [value]="cliente.nome" readonly />
    </div>
    <div class="form-group">
      <label for="cpfcnpj">CPF/CNPJ</label>
      <input id="cpfcnpj" type="text" [value]="cliente.cpfcnpj" readonly />
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input id="telefone" type="text" [value]="cliente.telefone" readonly />
    </div>
    <div class="form-group">
      <label for="celular">Celular</label>
      <input id="celular" type="text" [value]="cliente.celular" readonly />
    </div>
  </div>
  
  <div class="form-group">
    <label for="endereco">Endereço</label>
    <input id="endereco" type="text" [value]="cliente.endereco" readonly />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="cidade">Cidade</label>
      <input id="cidade" type="text" [value]="cliente.cidade" readonly />
    </div>
    <div class="form-group">
      <label for="bairro">Bairro</label>
      <input id="bairro" type="text" [value]="cliente.bairro" readonly />
    </div>
  </div>



  <div class="form-actions">
    <button type="button" class="btn-secondary" (click)="voltar()">
      Voltar
    </button>

    <button type="button" class="btn-secondary" (click)="abrirPopupVeiculos()">
      Consultar Veículos
    </button>

    <a [routerLink]="['/clientes', cliente.idcliente, 'editar']" class="btn-primary">Editar</a>

    <button
      type="button"
      class="btn-whatsapp-icon"
      (click)="abrirWhatsApp()"
      title="Chamar no WhatsApp"
      aria-label="Chamar no WhatsApp">
      <img src="/whatsapp-icon.png" alt="" />
    </button>
  </div>

  <!-- Popup / Modal de Veículos -->
  <div *ngIf="mostrarPopupVeiculos" class="modal-overlay" (click)="fecharPopupVeiculos()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>Veículos do Cliente</h2>
        <button type="button" class="btn-close" (click)="fecharPopupVeiculos()">&times;</button>
      </div>

      <div class="modal-body">
        <div *ngIf="!cliente.veiculos || cliente.veiculos.length === 0" class="info-box">
          Nenhum veículo cadastrado.
        </div>

        <table *ngIf="cliente.veiculos && cliente.veiculos.length > 0" class="tabela-veiculos">
          <thead>
            <tr>
              <th>Placa</th>
              <th>Montadora</th>
              <th>Modelo</th>
              <th>Ano</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let veiculo of cliente.veiculos">
              <td>{{ veiculo.placa }}</td>
              <td>{{ veiculo.montadora }}</td>
              <td>{{ veiculo.modelo }}</td>
              <td>{{ veiculo.ano }}</td>
              <td>
                <a [routerLink]="['/veiculos', veiculo.idveiculo, 'editar']" class="btn-primary">
                  Editar
                </a>
              </td>
            </tr>
          </tbody>
        </table>

        <button
          type="button"
          class="btn-secondary btn-adicionar"
          *ngIf="!mostrarFormNovoVeiculo"
          (click)="abrirFormNovoVeiculo()"
        >
          + Adicionar Veículo
        </button>

        <form
          *ngIf="mostrarFormNovoVeiculo"
          [formGroup]="novoVeiculoForm"
          (ngSubmit)="salvarNovoVeiculo()"
          class="form-novo-veiculo"
        >
          <div class="form-row">
            <div class="form-group">
              <label for="novaPlaca">Placa</label>
              <input id="novaPlaca" type="text" formControlName="placa" />
            </div>

            <div class="form-group">
              <label for="novaMontadora">Montadora</label>
              <input id="novaMontadora" type="text" formControlName="montadora" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="novoModelo">Modelo</label>
              <input id="novoModelo" type="text" formControlName="modelo" />
            </div>

            <div class="form-group">
              <label for="novoAno">Ano</label>
              <input id="novoAno" type="number" formControlName="ano" />
            </div>
          </div>

          <div class="form-group">
            <label for="novaCor">Cor</label>
            <input id="novaCor" type="text" formControlName="cor" />
          </div>

          <div *ngIf="erroNovoVeiculo" class="info-box error">
            {{ erroNovoVeiculo }}
          </div>

          <div class="form-actions">
            <button type="button" class="btn-secondary" (click)="cancelarNovoVeiculo()">
              Cancelar
            </button>
            <button type="submit" class="btn-primary" [disabled]="novoVeiculoForm.invalid || salvandoVeiculo">
              {{ salvandoVeiculo ? 'Salvando...' : 'Salvar Veículo' }}
            </button>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="fecharPopupVeiculos()">Fechar</button>
      </div>
    </div>
  </div>
</form>
